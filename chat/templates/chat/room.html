<!DOCTYPE html>
<html>
<head><title>Test Room</title></head>
<body>
    <h2>Room ID: <span id="room-name">{{ room_id }}</span></h2>
    <div id="chat-log" style="height: 300px; width: 400px; border: 1px solid black; overflow-y: scroll; padding: 10px;"></div>
    <div id="typing-indicator" style="height: 20px; color: gray; font-style: italic;"></div>
    <input id="chat-message-input" type="text" size="45" placeholder="Type a message (e.g., @admin hello!)">
    <button id="chat-message-submit">Send</button>
    <script>
        const roomId = "{{ room_id }}";
        const chatSocket = new WebSocket('ws://' + window.location.host + '/ws/chat/' + roomId + '/');
        const chatLog = document.getElementById('chat-log');
        const typingIndicator = document.getElementById('typing-indicator');
        const messageInput = document.getElementById('chat-message-input');
        let typingTimeout;
        // Listen for real time broadcasts
        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if (data.action === 'receive_message') {
                chatLog.innerHTML += '<div><b>' + data.sender + ':</b> ' + data.message + '</div>';
                chatLog.scrollTop = chatLog.scrollHeight;
            } else if (data.action === 'typing_indicator') {
                typingIndicator.innerText = data.is_typing ? (data.user + " is typing...") : "";
            } else if (data.action === 'status_update') {
                const color = data.status === 'online' ? 'green' : 'red';
                chatLog.innerHTML += `<div style="color: ${color}; font-size: 0.9em;">` + 
                                     `<i>System: ${data.user} is now ${data.status}.</i></div>`;
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        };
        // Send chat message
        document.getElementById('chat-message-submit').onclick = function(e) {
            chatSocket.send(JSON.stringify({ 'action': 'send_message', 'message': messageInput.value }));
            messageInput.value = '';
            chatSocket.send(JSON.stringify({ 'action': 'set_typing', 'is_typing': false }));
        };
        // Debounce typing indicator
        messageInput.addEventListener('input', function(e) {
            chatSocket.send(JSON.stringify({ 'action': 'set_typing', 'is_typing': true }));
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                chatSocket.send(JSON.stringify({ 'action': 'set_typing', 'is_typing': false }));
            }, 1000);
        });
    </script>
</body>
</html>
